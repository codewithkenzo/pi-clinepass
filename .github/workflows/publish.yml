name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      # Trusted publishing via OIDC — no long-lived NPM_TOKEN.
      # Configure trusted publisher on npm for this repo + workflow first:
      # https://docs.npmjs.com/trusted-publishers/
      # Local publish still uses your existing `npm whoami` login.
      - uses: JS-DevTools/npm-publish@v4
