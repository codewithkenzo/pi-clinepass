name: Update Pi AI runtime

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Require dedicated updater token
        env:
          RUNTIME_UPDATE_TOKEN: ${{ secrets.RUNTIME_UPDATE_TOKEN }}
        run: |
          if [ -z "$RUNTIME_UPDATE_TOKEN" ]; then
            echo "RUNTIME_UPDATE_TOKEN is required; GITHUB_TOKEN cannot trigger pull_request CI." >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Resolve and pin latest runtime
        id: runtime
        run: |
          latest="$(npm view @earendil-works/pi-ai version)"
          if ! [[ "$latest" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "npm returned invalid stable semver: $latest" >&2
            exit 1
          fi
          current="$(bun -e 'const p=await Bun.file("package.json").json(); console.log(p.dependencies["@codewithkenzo/pi-ai-runtime"].split("@").at(-1))')"
          echo "current=$current latest=$latest"
          bun scripts/update-runtime.ts "$latest"
          if git diff --quiet -- package.json; then
            test -z "$(git diff --name-only)" || { echo "Updater changed unexpected files" >&2; exit 1; }
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun install --lockfile-only
          bun install --frozen-lockfile
          expected="npm:@earendil-works/pi-ai@$latest"
          actual="$(bun -e 'const p=await Bun.file("package.json").json(); console.log(p.dependencies["@codewithkenzo/pi-ai-runtime"])')"
          test "$actual" = "$expected"
          test "$(node -p 'require("./node_modules/@codewithkenzo/pi-ai-runtime/package.json").version')" = "$latest"
          unexpected="$(git diff --name-only | grep -Ev '^(package\.json|bun\.lock)$' || true)"
          test -z "$unexpected" || { echo "Unexpected updater files: $unexpected" >&2; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create or update runtime PR
        if: steps.runtime.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.RUNTIME_UPDATE_TOKEN }}
          base: main
          branch: automation/pi-ai-runtime
          delete-branch: false
          commit-message: "chore: update Pi AI runtime"
          title: "chore: update Pi AI runtime"
          body: |
            Updates exact `@codewithkenzo/pi-ai-runtime` npm alias and lockfile.

            Full pull-request CI must pass before review and merge. This workflow never auto-merges.
          add-paths: |
            package.json
            bun.lock
